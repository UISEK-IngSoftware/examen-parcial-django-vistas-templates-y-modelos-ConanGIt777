{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡NO PIRATEES!</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap');

        body {
            background: linear-gradient(135deg, #0b0711 0%, #1b1f2a 100%);
            color: #f8f9fa;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .warning-card {
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 1.5rem;
            padding: 3rem;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .warning-card h1 {
            font-size: clamp(3rem, 5vw, 4.5rem);
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            color: #ff6b6b;
        }

        .warning-card p {
            color: #d1d5db;
            font-size: 1.15rem;
            margin-bottom: 2rem;
        }

        .warning-card .btn {
            min-width: 180px;
        }
    </style>
</head>
<body>
    <div class="warning-card">
        <h1>NO PIRATEES!!!</h1>
        <p>Esta película no está disponible para descarga ilegal. Disfruta del catálogo con responsabilidad.</p>
        <a href="{% url 'movies:index' %}" class="btn btn-light btn-lg">Regresar al catálogo</a>
    </div>
</body>
</html>
